name: zorbalik_uygulamasi
description: "Yapay zeka destekli, çocuklarda her türlü zorbalığa karşı farkındalık yaratan ve güvenli rehberlik sunan mobil platform."
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0

  # UI & Animasyonlar
  flutter_animate: ^4.5.2
  flutter_custom_clippers: ^2.1.0
  confetti: ^0.8.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0

  # Yardımcı Paketler
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.1.1
  http: ^1.3.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  get_it: ^9.2.1

  # Multimedya
  youtube_player_iframe: ^6.0.2
  just_audio: ^0.10.5
  flutter_tts: ^4.2.5

  # Reklamlar
  google_mobile_ads: ^9.1.0

  # Bildirimler
  flutter_local_notifications: ^22.3.1

  # PDF & Yazdırma
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/app_icon_two.png

  android_12:
    image: assets/app_icon_two.png

  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/image/
    - assets/data/
    - assets/audio/