name: zorbalik_uygulamasi
description: "Yapay zeka destekli, çocuklarda her türlü zorbalığa karşı farkındalık yaratan ve güvenli rehberlik sunan mobil platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_messaging: ^16.2.0
  cloud_functions: ^6.3.1

  # UI & Animasyonlar
  flutter_animate: ^4.5.2
  flutter_custom_clippers: ^2.1.0
  confetti: ^0.8.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0

  # Yardımcı Paketler
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.2
  connectivity_plus: ^7.1.1
  http: ^1.3.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  get_it: ^7.7.0

  # Multimedya
  youtube_player_iframe: ^6.0.2
  just_audio: ^0.10.5
  flutter_tts: ^4.2.5

  # Reklamlar
  google_mobile_ads: ^5.2.0

  # Bildirimler
  flutter_local_notifications: ^17.2.2

  # PDF & Yazdırma
  pdf: ^3.12.0
  printing: ^5.14.3
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# Uygulama İkonu Yapılandırması
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/app_icon_two.png
  android_12:
    image: assets/app_icon_two.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/image/
    - assets/data/